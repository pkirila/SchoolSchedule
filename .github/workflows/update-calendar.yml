name: Update school calendar

on:
  schedule:
    # 5:17 am and 12:17 pm Eastern (GitHub uses UTC; runs may start a few minutes late)
    - cron: "17 10 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build calendar.json from Google Calendar
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: node scripts/build-calendar.js
      - name: Save changes
        run: |
          if git diff --quiet -- calendar.json; then
            echo "Nothing to commit."
          else
            git config user.name "calendar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar.json
            git commit -m "Update school calendar"
            git push
          fi
